name: Dump map objects

on:
    # Daily. The check below is cheap, so most runs cost a few seconds and stop.
    schedule:
        - cron: "0 18 * * *"
    workflow_dispatch:
        inputs:
            force:
                description: "Dump even if this cache was already processed"
                type: boolean
                default: false

# Only one dump at a time; a queued run would race on the same branch.
concurrency:
    group: dump
    cancel-in-progress: false

jobs:
    dump:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # Compares the newest cache in the archive against data/meta.json's
            # cacheId. One small JSON fetch - no cache download.
            - name: Check for a new cache
              id: check
              run: npm run check-cache

            - name: Up to date
              if: steps.check.outputs.needed != 'true' && !inputs.force
              run: |
                  echo "Cache ${{ steps.check.outputs.cache_name }} already dumped; nothing to do." \
                      >> "$GITHUB_STEP_SUMMARY"

            # Everything below only runs when there is genuinely new data.
            - name: Download cache
              if: steps.check.outputs.needed == 'true' || inputs.force
              run: npm run download-cache

            - name: Dump
              if: steps.check.outputs.needed == 'true' || inputs.force
              run: |
                  VIEWER_COMMIT=$(git -C vendor/rs-map-viewer rev-parse HEAD)
                  export VIEWER_COMMIT
                  npm run dump

            - name: Commit data
              if: steps.check.outputs.needed == 'true' || inputs.force
              run: |
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/

                  # meta.json always changes (generatedAt), so ignore it when
                  # deciding whether anything real moved. A new cache revision
                  # with identical map data is possible and not worth a commit.
                  if git diff --cached --quiet -- data/ ':!data/meta.json'; then
                      echo "New cache ${{ steps.check.outputs.cache_name }}, but no data changes." \
                          >> "$GITHUB_STEP_SUMMARY"
                      # Still commit meta.json so cacheId advances and tomorrow's
                      # run does not re-download this same cache.
                      git commit -q -m "Record cache ${{ steps.check.outputs.cache_name }} (no data changes)"
                      git push
                      exit 0
                  fi

                  REVISION=$(node -p "require('./data/meta.json').revision")
                  git commit -q -m "Update dump for cache rev ${REVISION}"
                  git push

            - name: Summary
              if: (steps.check.outputs.needed == 'true' || inputs.force) && always()
              run: |
                  if [ -f data/meta.json ]; then
                      {
                          echo "### Dump summary"
                          echo '```json'
                          node -p "JSON.stringify(require('./data/meta.json').counts, null, 2)"
                          echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                  fi
